<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <base target="_top">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>BBPATROL 黑箱糾察隊</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      background-color: #050505;
      color: #ffffff;
      font-family: 'PingFang TC', 'Microsoft JhengHei', sans-serif;
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }

    #header {
      background-color: #050505;
      padding: 15px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #1a1a1a;
      flex-shrink: 0;
      gap: 12px;
    }

    .brand-title {
      margin: 0;
      font-size: 1.35rem;
      font-weight: bold;
      letter-spacing: 1px;
      line-height: 1.1;
    }

    .brand-subtitle {
      color: #33ffcc;
      font-size: 0.72rem;
      text-transform: uppercase;
      margin-top: 3px;
      letter-spacing: 0.5px;
    }

    .header-actions {
      display: flex;
      gap: 8px;
      align-items: center;
      flex-shrink: 0;
    }

    .back-btn,
    .refresh-btn {
      background-color: transparent;
      color: #33ffcc;
      border: 1px solid #33ffcc;
      border-radius: 999px;
      padding: 7px 12px;
      font-size: 0.82rem;
      cursor: pointer;
      display: none;
      white-space: nowrap;
    }

    .back-btn:active,
    .refresh-btn:active {
      background-color: rgba(51, 255, 204, 0.2);
    }

    #main-wrapper {
      flex: 1;
      position: relative;
      width: 100%;
      min-height: 0;
    }

    #menu-screen {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 15px;
      padding: 25px;
      height: 100%;
      align-content: center;
    }

    .region-btn {
      background-color: #000000;
      border: 1px solid #33ffcc;
      border-radius: 15px;
      color: #ffffff;
      padding: 25px 10px;
      font-size: 1.1rem;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.2s;
      text-align: center;
      box-shadow: 0 0 10px rgba(51, 255, 204, 0.1);
      user-select: none;
    }

    .region-btn:active {
      background-color: #33ffcc;
      color: #000000;
    }

    #data-screen {
      display: none;
      flex-direction: row;
      align-items: center;
      justify-content: flex-start;
      overflow-x: auto;
      scroll-snap-type: x mandatory;
      height: 100%;
      padding: 20px;
      gap: 20px;
      -webkit-overflow-scrolling: touch;
    }

    #data-screen::-webkit-scrollbar {
      display: none;
    }

    .bb-card {
      background-color: #000000;
      border: 1.5px solid #33ffcc;
      border-radius: 25px;
      width: 75vw;
      max-width: 330px;
      min-width: 270px;
      flex-shrink: 0;
      scroll-snap-align: center;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      transition:
        opacity 0.5s ease,
        transform 0.5s ease,
        width 0.5s ease,
        padding 0.5s ease,
        margin 0.5s ease;
    }

    .bb-card.fade-out {
      opacity: 0;
      transform: scale(0.7);
      width: 0;
      min-width: 0;
      padding: 0;
      margin: 0;
      border: 0 solid transparent;
      overflow: hidden;
    }

    .bb-title {
      font-size: 1.25rem;
      color: #33ffcc;
      margin-bottom: 12px;
      font-weight: bold;
      text-align: center;
    }

    .image-container {
      width: 100%;
      aspect-ratio: 9 / 16;
      border-radius: 15px;
      overflow: hidden;
      margin-bottom: 15px;
      background-color: #050505;
      border: 1px solid #1a1a1a;
    }

    .image-container img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .bb-body {
      font-size: 0.98rem;
      line-height: 1.6;
      text-align: center;
      color: #ffffff;
      margin-bottom: 15px;
      word-break: break-word;
      white-space: pre-wrap;
    }

    .bb-meta {
      color: #777777;
      font-size: 0.75rem;
      margin-bottom: 12px;
      text-align: center;
    }

    .card-control-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
      width: 100%;
      align-items: center;
    }

    .share-card-btn,
    .remove-card-btn {
      background-color: #1a1a1a;
      border-radius: 20px;
      padding: 8px 15px;
      font-size: 0.85rem;
      cursor: pointer;
      transition: all 0.2s;
      width: 88%;
      text-align: center;
      border: 1px solid transparent;
      color: #ffffff;
    }

    .share-card-btn {
      color: #33ffcc;
      border-color: #33ffcc;
    }

    .share-card-btn:active {
      background-color: #33ffcc;
      color: #000000;
    }

    .remove-card-btn {
      color: #ff4444;
      border-color: #ff4444;
    }

    .remove-card-btn:active:not(:disabled) {
      background-color: #ff4444;
      color: #ffffff;
    }

    .remove-card-btn:disabled {
      cursor: not-allowed;
      opacity: 0.45;
    }

    #no-data,
    #loading-text {
      width: 100%;
      text-align: center;
      color: #555555;
      font-size: 1rem;
      position: absolute;
      top: 50%;
      left: 0;
      transform: translateY(-50%);
      padding: 0 20px;
    }

    .error-text {
      color: #ff5555 !important;
    }

    @media (max-width: 420px) {
      #header {
        padding: 14px 16px;
      }

      .brand-title {
        font-size: 1.25rem;
      }

      .brand-subtitle {
        font-size: 0.68rem;
      }

      .back-btn,
      .refresh-btn {
        padding: 6px 10px;
        font-size: 0.78rem;
      }

      #menu-screen {
        padding: 22px;
        gap: 14px;
      }

      .region-btn {
        padding: 24px 8px;
        font-size: 1.08rem;
      }

      #data-screen {
        padding: 18px;
        gap: 18px;
      }

      .bb-card {
        width: 78vw;
        min-width: 265px;
      }
    }
  </style>
</head>

<body>
  <header id="header">
    <div class="brand-group">
      <div class="brand-title">BBPATROL</div>
      <div class="brand-subtitle">Black Box System</div>
    </div>

    <div class="header-actions">
      <button class="back-btn" id="back-btn" onclick="showMenu()">← 返回區域</button>
      <button class="refresh-btn" id="refresh-btn" onclick="refreshCurrentRegion()">🔄 刷新資料</button>
    </div>
  </header>

  <main id="main-wrapper">
    <div id="menu-screen">
      <div class="region-btn" onclick="filterData('北北基')">北北基</div>
      <div class="region-btn" onclick="filterData('桃竹苗')">桃竹苗</div>
      <div class="region-btn" onclick="filterData('中彰投')">中彰投</div>
      <div class="region-btn" onclick="filterData('雲嘉南')">雲嘉南</div>
      <div class="region-btn" onclick="filterData('高屏')">高屏</div>
      <div class="region-btn" onclick="filterData('宜花東')">宜花東</div>
    </div>

    <div id="data-screen"></div>
    <div id="loading-text" style="display: none;">資料同步中...</div>
    <div id="no-data" style="display: none;">該區域暫無糾察紀錄</div>
  </main>

  <script>
    /*
      ⚠️ 請改成你的 Supabase 資料
      Supabase 後台位置：
      Project Settings → API
      - Project URL
      - anon public key
    */
    const SUPABASE_URL = "https://sadnhsddereuhpfvdquk.supabaseClient.co";
    const SUPABASE_ANON_KEY = "sb_publishable_k_u54EP-ZibEk5ABR2_lQA__c41LUZI";

    const supabaseClient = window.supabaseClient.createClient(
      SUPABASE_URL,
      SUPABASE_ANON_KEY
    );

    const REGION_LIST = ["北北基", "桃竹苗", "中彰投", "雲嘉南", "高屏", "宜花東"];

    let allData = [];
    let currentRegion = "";

    window.addEventListener("load", async function () {
      getDeviceId();
      showLoading("資料同步中...");

      await loadDataFromServer();

      hideLoading();

      const params = new URLSearchParams(window.location.search);
      const region = params.get("region");
      const id = params.get("id");

      if (region && REGION_LIST.includes(region)) {
        filterData(region);

        if (id) {
          setTimeout(function () {
            scrollToCard(id);
          }, 300);
        }
      }
    });

    function showLoading(text) {
      const loadingText = document.getElementById("loading-text");
      loadingText.classList.remove("error-text");
      loadingText.textContent = text || "資料同步中...";
      loadingText.style.display = "block";
    }

    function showError(text) {
      const loadingText = document.getElementById("loading-text");
      loadingText.classList.add("error-text");
      loadingText.textContent = text || "資料讀取失敗";
      loadingText.style.display = "block";
    }

    function hideLoading() {
      document.getElementById("loading-text").style.display = "none";
    }

    function getDeviceId() {
      let deviceId = localStorage.getItem("bbp_noise_device_id");

      if (!deviceId) {
        deviceId =
          "dev_" +
          Date.now().toString(36) +
          "_" +
          Math.random().toString(36).slice(2, 12);

        localStorage.setItem("bbp_noise_device_id", deviceId);
      }

      return deviceId;
    }

    async function loadDataFromServer(callback) {
      try {
        const { data, error } = await supabase
          .from("noise_reports")
          .select("id, text, image_url, region, report_logs, report_count, is_active, created_at")
          .eq("is_active", true)
          .order("created_at", { ascending: false });

        if (error) {
          throw error;
        }

        allData = (data || []).map(function (item) {
          return {
            id: item.id,
            text: item.text || "",
            imageUrl: item.image_url || "",
            region: item.region || "",
            reportLogs: item.report_logs || "",
            reportCount: item.report_count || 0,
            isActive: item.is_active,
            createdAt: item.created_at || ""
          };
        });

        if (typeof callback === "function") {
          callback();
        }
      } catch (error) {
        console.error(error);
        allData = [];
        showError("資料讀取失敗：" + error.message);
      }
    }

    function filterData(regionName) {
      currentRegion = regionName;

      const dataScreen = document.getElementById("data-screen");
      const noData = document.getElementById("no-data");

      dataScreen.innerHTML = "";
      hideLoading();

      const filtered = allData.filter(function (item) {
        return String(item.region).trim() === regionName;
      });

      if (filtered.length > 0) {
        filtered.forEach(function (item, index) {
          const cardElement = createCardElement(item, index + 1, regionName);
          dataScreen.appendChild(cardElement);
        });

        dataScreen.style.display = "flex";
        noData.style.display = "none";
      } else {
        dataScreen.style.display = "none";
        noData.style.display = "block";
      }

      document.getElementById("menu-screen").style.display = "none";
      document.getElementById("back-btn").style.display = "block";
      document.getElementById("refresh-btn").style.display = "block";

      const cleanUrl =
        window.location.protocol +
        "//" +
        window.location.host +
        window.location.pathname +
        "?region=" +
        encodeURIComponent(regionName);

      window.history.replaceState({}, "", cleanUrl);
    }

    function createCardElement(item, cardNumber, regionName) {
      const card = document.createElement("div");
      card.className = "bb-card";
      card.id = "card-box-" + item.id;

      const title = document.createElement("div");
      title.className = "bb-title";
      title.textContent = "糾察紀錄 #" + cardNumber;
      card.appendChild(title);

      if (item.imageUrl && item.imageUrl.trim() !== "") {
        const imageContainer = document.createElement("div");
        imageContainer.className = "image-container";

        const img = document.createElement("img");
        img.src = item.imageUrl;
        img.alt = "BBPATROL 噪音偵測紀錄圖片";
        img.loading = "lazy";

        img.onerror = function () {
          imageContainer.style.display = "none";
        };

        imageContainer.appendChild(img);
        card.appendChild(imageContainer);
      }

      const body = document.createElement("div");
      body.className = "bb-body";
      body.textContent = item.text;
      card.appendChild(body);

      const meta = document.createElement("div");
      meta.className = "bb-meta";
      meta.textContent = "撤走通報：" + item.reportCount + "/10";
      card.appendChild(meta);

      const controls = document.createElement("div");
      controls.className = "card-control-group";

      const shareBtn = document.createElement("button");
      shareBtn.className = "share-card-btn";
      shareBtn.type = "button";
      shareBtn.textContent = "🔗 分享此紀錄";
      shareBtn.addEventListener("click", function () {
        shareCard(shareBtn, regionName, item.id);
      });

      const removeBtn = document.createElement("button");
      removeBtn.className = "remove-card-btn";
      removeBtn.type = "button";

      const localKey = "bbp_noise_reported_" + item.id;
      const lastReportedAt = Number(localStorage.getItem(localKey) || "0");
      const isCoolingDown = Date.now() - lastReportedAt < 10 * 60 * 1000;

      if (isCoolingDown) {
        removeBtn.disabled = true;
        removeBtn.textContent = "✅ 已通報";
      } else {
        removeBtn.textContent = "🛑 通報已撤走";
        removeBtn.addEventListener("click", function () {
          reportWithdraw(removeBtn, item.id);
        });
      }

      controls.appendChild(shareBtn);
      controls.appendChild(removeBtn);

      card.appendChild(controls);

      return card;
    }

    function showMenu() {
      currentRegion = "";

      document.getElementById("menu-screen").style.display = "grid";
      document.getElementById("data-screen").style.display = "none";
      document.getElementById("no-data").style.display = "none";
      document.getElementById("back-btn").style.display = "none";
      document.getElementById("refresh-btn").style.display = "none";
      hideLoading();

      const cleanUrl =
        window.location.protocol +
        "//" +
        window.location.host +
        window.location.pathname;

      window.history.replaceState({}, "", cleanUrl);
    }

    async function refreshCurrentRegion() {
      if (!currentRegion) {
        return;
      }

      const dataScreen = document.getElementById("data-screen");
      const noData = document.getElementById("no-data");

      noData.style.display = "none";
      dataScreen.style.display = "none";
      dataScreen.innerHTML = "";

      showLoading("數據即時同步中...");

      await loadDataFromServer(function () {
        filterData(currentRegion);
      });
    }

    async function shareCard(buttonObj, region, reportId) {
      const baseUrl =
        window.location.protocol +
        "//" +
        window.location.host +
        window.location.pathname;

      const shareUrl =
        baseUrl +
        "?region=" +
        encodeURIComponent(region) +
        "&id=" +
        encodeURIComponent(reportId);

      try {
        if (navigator.share) {
          await navigator.share({
            title: "BBPATROL 噪音偵測紀錄",
            text: "查看此噪音偵測紀錄",
            url: shareUrl
          });
          return;
        }

        await navigator.clipboard.writeText(shareUrl);
        showShareSuccess(buttonObj);
      } catch (error) {
        console.warn(error);

        try {
          await navigator.clipboard.writeText(shareUrl);
          showShareSuccess(buttonObj);
        } catch (copyError) {
          alert("分享連結複製失敗，請手動複製網址列連結。");
        }
      }
    }

    function showShareSuccess(buttonObj) {
      const oldText = buttonObj.textContent;

      buttonObj.textContent = "✅ 已複製到剪貼簿";
      buttonObj.style.borderColor = "#33ffcc";
      buttonObj.style.color = "#000000";
      buttonObj.style.backgroundColor = "#33ffcc";

      setTimeout(function () {
        buttonObj.textContent = oldText || "🔗 分享此紀錄";
        buttonObj.style.borderColor = "#33ffcc";
        buttonObj.style.color = "#33ffcc";
        buttonObj.style.backgroundColor = "#1a1a1a";
      }, 2000);
    }

    async function reportWithdraw(buttonObj, reportId) {
      const deviceId = getDeviceId();

      buttonObj.disabled = true;
      buttonObj.textContent = "⏳ 處理中...";

      try {
        const { data, error } = await supabaseClient.rpc("report_noise_withdraw", {
          p_report_id: reportId,
          p_device_id: deviceId
        });

        if (error) {
          throw error;
        }

        const result = data || {};

        if (result.status === "cooldown") {
          buttonObj.textContent = "✅ 已通報";
          localStorage.setItem("bbp_noise_reported_" + reportId, String(Date.now()));
          return;
        }

        if (result.status === "updated") {
          buttonObj.textContent = "✅ 已通報完成";
          localStorage.setItem("bbp_noise_reported_" + reportId, String(Date.now()));

          setTimeout(function () {
            refreshCurrentRegion();
          }, 1200);

          return;
        }

        if (result.status === "deleted") {
          buttonObj.textContent = "✅ 達標，資料下架中";
          localStorage.setItem("bbp_noise_reported_" + reportId, String(Date.now()));

          setTimeout(function () {
            const targetCardBox = document.getElementById("card-box-" + reportId);

            if (targetCardBox) {
              targetCardBox.classList.add("fade-out");

              setTimeout(async function () {
                await loadDataFromServer(function () {
                  filterData(currentRegion);
                });
              }, 550);
            } else {
              refreshCurrentRegion();
            }
          }, 800);

          return;
        }

        if (result.status === "not_found") {
          buttonObj.textContent = "⚠️ 已下架或不存在";

          setTimeout(function () {
            refreshCurrentRegion();
          }, 1200);

          return;
        }

        buttonObj.textContent = "⚠️ 無法通報";

        setTimeout(function () {
          buttonObj.disabled = false;
          buttonObj.textContent = "🛑 通報已撤走";
        }, 2000);

      } catch (error) {
        console.error(error);
        buttonObj.textContent = "❌ 系統錯誤";

        setTimeout(function () {
          buttonObj.disabled = false;
          buttonObj.textContent = "🛑 通報已撤走";
        }, 2200);
      }
    }

    function scrollToCard(reportId) {
      const targetCard = document.getElementById("card-box-" + reportId);

      if (targetCard) {
        targetCard.scrollIntoView({
          behavior: "smooth",
          inline: "center",
          block: "nearest"
        });
      }
    }
  </script>
</body>
</html>
